version: '3.8'

services:
  zen-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://ihdlwogvjfgawgsalgng.supabase.co}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_KobV2o95Ymfem77b4zVBJg_E_onldRD}
    container_name: zen-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:80/healthz || wget -q -O - http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
